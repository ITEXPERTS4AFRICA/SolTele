    <!-- Theme + language resolved before first paint (no flash) -->
    <script>
      ;(function () {
        try {
          var d = document.documentElement
          var t = localStorage.getItem('soltele-theme')
          if (t !== 'light' && t !== 'dark') {
            t = 'light'
          }
          d.classList.toggle('dark', t === 'dark')
          d.style.colorScheme = t
          var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('soltele-lang')
          if (l !== 'fr' && l !== 'en') {
            l = (navigator.language || 'fr').toLowerCase().indexOf('en') === 0 ? 'en' : 'fr'
          }
          d.lang = l
        } catch (e) {}
      })()
